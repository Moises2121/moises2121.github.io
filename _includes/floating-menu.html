<!-- Floating menu for easier access -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <div class="floating-menu">

    <a href="{{ '/' | relative_url }}" class="float-btn" title="Home">
    <span class="material-symbols-outlined">home</span>
    </a>
    
    <a href="{{ '/SoftwareEngineering.html' | relative_url }}" class="float-btn">
    <span class="material-symbols-outlined">engineering</span>
     </a>
    
    <a href="{{ '/Algorithms.html' | relative_url }}" class="float-btn">
    <span class="material-symbols-outlined">account_tree</span>
    </a>
    
    <a href="{{ '/Databases.html' | relative_url }}" class="float-btn">
    <span class="material-symbols-outlined">database</span>
    </a>

    <button id="darkmode-btn" class="float-btn" title="Toggle Dark Mode" style="border:none; cursor:pointer;">
      <span class="material-symbols-outlined" id="darkmode-icon">dark_mode</span>
    </button>
  </div>

<!-- Darkmode.js by Sandoche - https://github.com/sandoche/Darkmode.js - MIT License -->
<script src="https://cdn.jsdelivr.net/npm/darkmode-js@1.5.7/lib/darkmode-js.min.js"></script>
<script src="{{ '/assets/js/darkmode.js' | relative_url }}"></script>

<!-- active button highlighted on currentPage -->
<script>
  const currentPage = window.location.pathname.split('/').pop();
  document.querySelectorAll('.floating-menu a.float-btn').forEach(btn => {
    
    if ((currentPage === '' || currentPage === 'index.html') && btn.title === 'Home') {
      btn.classList.add('active');
    }
    if (btn.href.includes(currentPage) && currentPage !== '' && currentPage !== 'index.html') {
      btn.classList.add('active');
    }
  });

  const dmBtn = document.getElementById('darkmode-btn');
  const dmIcon = document.getElementById('darkmode-icon');
  
  function updateIcon() {
    dmIcon.textContent = window.darkmode.isActivated() ? 'light_mode' : 'dark_mode';
  }

  dmBtn.addEventListener('click', () => {
    window.darkmode.toggle();
    updateIcon();
  });

  updateIcon();
</script>
