version: '3.8'
services:
  jekyll:
    image: jekyll/jekyll:4
    command: jekyll serve --watch --livereload --force_polling --drafts
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development

volumes:
  bundle_cache:
